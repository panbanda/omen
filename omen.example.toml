# Omen configuration
# Copy this file to `omen.toml` or `.omen/omen.toml` and change the values.
# Each value in this file is the default value. Documentation:
# https://github.com/panbanda/omen

# Glob patterns of files to skip. Omen adds them to the built-in ignores.
# Example: exclude = ["vendor/**", "**/*.pb.go"]
exclude = []

# If true, omen also analyzes the generated and minified files that it skips
# by default. By default omen skips a JS or TS file when the name ends in
# .min, .bundle, .chunk, -min, -bundle, _min, or _bundle before the extension,
# and each file below a directory named node_modules, target, dist, build,
# coverage, vendor, .next, _next, .turbo, or .cache.
include_generated = false

# If true, `clones` and `temporal` skip test files.
# `clones --include-tests` overrides the value for one run.
exclude_tests = true

# Gate modes: "off" gives the report only. "warn" also writes a warning to
# stderr. "error" also exits with status 2 on a violation.
# The `--gate` flag overrides the value of `gate`.

[complexity]
gate = "off"
# The highest cyclomatic complexity that the gate accepts.
cyclomatic_max = 20
# The highest cognitive complexity that the gate accepts.
cognitive_max = 30

[score]
gate = "off"
# The lowest overall score that the gate accepts. The `--fail-under` flag
# overrides the value.
min = 80.0

[stubs]
gate = "off"

[mutation]
gate = "off"

# A history window is a duration such as "30d", "3m", or "1y".
# The value "all" selects all the history, except for `changes`.

[churn]
since = "6m"

[hotspot]
# The window ends at the date of the analyzed revision, not at the current time.
since = "90d"

[defect]
since = "30d"

[changes]
since = "30d"

[satd]
# Markers to detect in addition to the built-in markers, such as TODO and FIXME.
markers = []

[duplicates]
# The minimum number of tokens in a clone.
min_tokens = 50
# The minimum similarity of two fragments, from 0.0 to 1.0.
min_similarity = 0.9

[feature_flags]
# The age in days after which a flag is stale. The `--stale-days` flag
# overrides the value.
stale_days = 90
# Built-in providers to enable. If the list is empty, no built-in detection runs.
# Available: launchdarkly, flipper, split, unleash, generic, env
# Example: providers = ["launchdarkly"]
providers = []

# Custom providers for in-house systems.
# [[feature_flags.custom_providers]]
# name = "my_feature_system"
# languages = ["ruby", "python"]
# query = '''
# (call
#   receiver: (constant) @receiver
#   (#eq? @receiver "Feature")
#   method: (identifier) @method
#   (#match? @method "^enabled\\?$")
#   arguments: (argument_list
#     .
#     (simple_symbol) @flag_key))
# '''
custom_providers = []
