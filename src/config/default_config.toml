# Omen Configuration
# See https://github.com/panbanda/omen for documentation

# Exclude built/minified assets (*.min.js, *.bundle.js, *.chunk.js, etc.)
exclude_built_assets = true

# File exclusion patterns (glob)
exclude = [
    "**/vendor/**",
    "**/node_modules/**",
    "**/.git/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/*.generated.*",
]

[complexity]
cyclomatic_error = 20
cognitive_error = 30

[satd]
custom_markers = []

[churn]
since = "6m"
top = 20

[duplicates]
min_tokens = 50
min_similarity = 0.9

[hotspot]
top = 20
days = 90

[defect]
churn_days = 30

[score]
# fail_under = 80

[feature_flags]
stale_days = 90
# Built-in providers to enable. If empty, no built-in detection runs.
# Available: launchdarkly, flipper, split, unleash, generic, env
providers = []
