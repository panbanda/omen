name: 'Omen Analysis'
description: 'Run pull request diff risk analysis and repository health scoring'
author: 'panbanda'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  version:
    description: 'Omen version to install (for example, "4.20.3"), or "latest" for the newest stable release.'
    required: false
    default: 'latest'
  path:
    description: 'Repository path to analyze, relative to the workflow workspace.'
    required: false
    default: '.'
  comment:
    description: 'Post or update a sticky analysis comment on pull requests.'
    required: false
    default: 'false'
  label:
    description: 'Create and apply a risk-level label to pull requests.'
    required: false
    default: 'false'
  label-template:
    description: 'Label name template. Use {{level}} for risk level replacement.'
    required: false
    default: 'risk: {{level}}'
  label-color-low:
    description: 'Hex color (without #) for the low risk label'
    required: false
    default: '0e8a16'
  label-color-medium:
    description: 'Hex color (without #) for the medium risk label'
    required: false
    default: 'fbca04'
  label-color-high:
    description: 'Hex color (without #) for the high risk label'
    required: false
    default: 'd93f0b'
  check:
    description: 'Fail pull request analysis when the risk level meets or exceeds the configured threshold.'
    required: false
    default: 'false'
  check-threshold:
    description: 'Risk level threshold for check failure (low, medium, high)'
    required: false
    default: 'high'
  summary:
    description: 'Write risk, change-size, repository health, and score-component results to the job step summary.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token used to resolve and download releases and, when enabled, manage pull request comments and labels.'
    required: false
    default: ${{ github.token }}

outputs:
  risk-score:
    description: 'Pull request diff risk score (0.0 - 1.0); empty on non-pull-request events.'
    value: ${{ steps.diff.outputs.risk-score }}
  risk-level:
    description: 'Pull request risk level (low, medium, high); empty on non-pull-request events.'
    value: ${{ steps.diff.outputs.risk-level }}
  health-score:
    description: 'Repository health score (0 - 100)'
    value: ${{ steps.score.outputs.health-score }}
  health-grade:
    description: 'Health grade (A, B, C, D, F)'
    value: ${{ steps.score.outputs.health-grade }}
  diff-json:
    description: 'Full omen diff JSON output; empty on non-pull-request events.'
    value: ${{ steps.diff.outputs.diff-json }}
  score-json:
    description: 'Full omen score JSON output'
    value: ${{ steps.score.outputs.score-json }}

runs:
  using: 'composite'
  steps:
    - name: Resolve omen version
      id: resolve
      uses: actions/github-script@v9
      env:
        INPUT_VERSION: ${{ inputs.version }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          try {
            const targets = {
              'Linux-X64': 'x86_64-unknown-linux-gnu',
              'Linux-ARM64': 'aarch64-unknown-linux-gnu',
              'macOS-X64': 'x86_64-apple-darwin',
              'macOS-ARM64': 'aarch64-apple-darwin',
            };
            const platform = `${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}`;
            const target = targets[platform];
            if (!target) {
              throw new Error(`Unsupported platform: ${platform}`);
            }

            let release;
            if (process.env.INPUT_VERSION === 'latest') {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: 'panbanda',
                repo: 'omen',
                per_page: 20,
              });
              release = releases.find(candidate =>
                !candidate.prerelease && !candidate.draft && candidate.tag_name.startsWith('omen-v')
              );
              if (!release) {
                throw new Error('Could not determine the latest stable omen release');
              }
            } else {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: 'panbanda',
                repo: 'omen',
                tag: `omen-v${process.env.INPUT_VERSION}`,
              });
              release = data;
            }

            const version = release.tag_name.replace(/^omen-v/, '');
            const assetName = `omen_${version}_${target}.tar.gz`;
            const asset = release.assets.find(candidate => candidate.name === assetName);
            if (!asset) {
              throw new Error(`Asset ${assetName} was not found in ${release.tag_name}`);
            }

            core.setOutput('version', version);
            core.setOutput('target', target);
            core.setOutput('asset-name', assetName);
            core.setOutput('asset-url', asset.url);
            core.info(`Resolved omen ${version} for ${target}`);
          } catch (error) {
            core.setFailed(`Failed to resolve omen release: ${error.message}. Check the version input against released versions at https://github.com/panbanda/omen/releases.`);
          }

    - name: Restore cached omen binary
      id: omen-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/omen-install
        key: omen-${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.target }}

    - name: Install omen
      id: install
      uses: actions/github-script@v9
      env:
        OMEN_VERSION: ${{ steps.resolve.outputs.version }}
        OMEN_TARGET: ${{ steps.resolve.outputs.target }}
        OMEN_ASSET_NAME: ${{ steps.resolve.outputs.asset-name }}
        OMEN_ASSET_URL: ${{ steps.resolve.outputs.asset-url }}
        OMEN_CACHE_HIT: ${{ steps.omen-cache.outputs.cache-hit }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          const version = process.env.OMEN_VERSION;
          const target = process.env.OMEN_TARGET;
          const assetName = process.env.OMEN_ASSET_NAME;
          const installDir = `${process.env.RUNNER_TEMP}/omen-install`;
          const binaryPath = `${installDir}/omen`;

          try {
            await core.group(`Install omen ${version} for ${target}`, async () => {
              const cacheHit = process.env.OMEN_CACHE_HIT === 'true' && fs.existsSync(binaryPath);
              if (cacheHit) {
                core.info('Using cached omen binary');
              } else {
                if (process.env.OMEN_CACHE_HIT === 'true') {
                  core.warning('The omen cache entry did not contain a binary; downloading it again');
                }
                await io.mkdirP(installDir);
                const response = await fetch(process.env.OMEN_ASSET_URL, {
                  headers: {
                    'Accept': 'application/octet-stream',
                    'Authorization': `Bearer ${process.env.INPUT_GITHUB_TOKEN}`,
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                });
                if (!response.ok) {
                  throw new Error(`download failed for ${assetName}: ${response.status} ${response.statusText}`);
                }

                const tarPath = `${installDir}/${assetName}`;
                fs.writeFileSync(tarPath, Buffer.from(await response.arrayBuffer()));
                const exitCode = await exec.exec('tar', ['xzf', tarPath, '-C', installDir], {
                  ignoreReturnCode: true,
                });
                if (exitCode !== 0) {
                  throw new Error(`tar extraction failed with exit code ${exitCode}`);
                }
                fs.rmSync(tarPath, { force: true });
              }

              if (!fs.existsSync(binaryPath)) {
                throw new Error(`installed binary was not found at ${binaryPath}`);
              }
              fs.chmodSync(binaryPath, 0o755);
              core.addPath(installDir);
              core.setOutput('version', version);
            });
          } catch (error) {
            core.setFailed(`Failed to install omen ${version}: ${error.message}. Check the version input against released versions and retry the workflow.`);
          }

    - name: Run omen diff
      id: diff
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        INPUT_PATH: ${{ inputs.path }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const args = [
            '-f', 'json', '-p', process.env.INPUT_PATH,
            'diff', '--target', `origin/${process.env.BASE_REF}`,
          ];
          const result = await exec.getExecOutput('omen', args, { ignoreReturnCode: true });
          if (result.exitCode !== 0) {
            const stderr = result.stderr.trim() || '(no stderr output)';
            core.setFailed(`omen diff failed with exit code ${result.exitCode}: ${stderr}. Run "omen ${args.join(' ')}" locally to reproduce.`);
            return;
          }

          let diff;
          try {
            diff = JSON.parse(result.stdout);
          } catch (error) {
            core.setFailed(`omen diff returned invalid JSON: ${error.message}. Run "omen ${args.join(' ')}" locally to inspect the output.`);
            return;
          }

          core.setOutput('risk-score', String(diff.score));
          core.setOutput('risk-level', diff.level);

          const json = JSON.stringify(diff);
          if (json.length < 900000) {
            core.setOutput('diff-json', json);
          } else {
            const filePath = `${process.env.RUNNER_TEMP}/omen-diff.json`;
            fs.writeFileSync(filePath, json);
            core.warning(`diff-json output exceeds 900KB (${json.length} bytes), writing to file instead`);
            core.setOutput('diff-json', filePath);
          }

    - name: Explain skipped diff analysis
      if: github.event_name != 'pull_request'
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          core.warning(`Skipping omen diff on ${context.eventName}. Without an explicit PR base, omen auto-detects main or master, which does not reliably describe a push or manually dispatched change. Repository health scoring will still run, and the job summary remains available when enabled.`);

    - name: Run omen score
      id: score
      uses: actions/github-script@v9
      env:
        INPUT_PATH: ${{ inputs.path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const args = ['-f', 'json', '-p', process.env.INPUT_PATH, 'score'];
          const result = await exec.getExecOutput('omen', args, { ignoreReturnCode: true });
          if (result.exitCode !== 0) {
            const stderr = result.stderr.trim() || '(no stderr output)';
            core.setFailed(`omen score failed with exit code ${result.exitCode}: ${stderr}. Run "omen ${args.join(' ')}" locally to reproduce.`);
            return;
          }

          let score;
          try {
            score = JSON.parse(result.stdout);
          } catch (error) {
            core.setFailed(`omen score returned invalid JSON: ${error.message}. Run "omen ${args.join(' ')}" locally to inspect the output.`);
            return;
          }

          core.setOutput('health-score', String(score.overall_score));
          core.setOutput('health-grade', score.grade);

          const json = JSON.stringify(score);
          if (json.length < 900000) {
            core.setOutput('score-json', json);
          } else {
            const filePath = `${process.env.RUNNER_TEMP}/omen-score.json`;
            fs.writeFileSync(filePath, json);
            core.warning(`score-json output exceeds 900KB (${json.length} bytes), writing to file instead`);
            core.setOutput('score-json', filePath);
          }

    - name: Write Omen job summary
      if: inputs.summary == 'true'
      uses: actions/github-script@v9
      env:
        DIFF_JSON: ${{ steps.diff.outputs.diff-json }}
        SCORE_JSON: ${{ steps.score.outputs.score-json }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          function loadJson(input, label, required = true) {
            if (!input) {
              if (required) throw new Error(`Missing ${label} JSON output`);
              return null;
            }
            try {
              return JSON.parse(input);
            } catch {
              try {
                return JSON.parse(fs.readFileSync(input, 'utf8'));
              } catch (error) {
                throw new Error(`Failed to load ${label} JSON: ${error.message}`);
              }
            }
          }

          let diff;
          let score;
          try {
            diff = loadJson(process.env.DIFF_JSON, 'diff', false);
            score = loadJson(process.env.SCORE_JSON, 'score');
          } catch (error) {
            core.warning(`Skipping job summary: ${error.message}`);
            return;
          }
          const signal = (n) => (n >= 80 ? 'Good' : n >= 60 ? 'Watch' : 'Needs work');
          const riskLevel = diff ? String(diff.level).toUpperCase() : 'Not available';
          const riskScore = diff ? `${Math.round(diff.score * 100)}%` : 'Not available';

          core.summary
            .addHeading('Omen Analysis', 2)
            .addTable([
              [
                { data: 'Health', header: true },
                { data: 'PR risk', header: true },
                { data: 'Changes', header: true },
              ],
              [
                `${score.grade} (${Math.round(score.overall_score)}/100)`,
                diff ? `${riskLevel} (${riskScore})` : 'Not available',
                diff
                  ? `${diff.files_modified} files, +${diff.lines_added}/-${diff.lines_deleted}, ${diff.commits} commits`
                  : 'Not available',
              ],
            ]);

          if (!diff) {
            core.summary.addRaw('Diff risk and change-size metrics are only reported for pull request events.\n\n');
          }

          const componentRows = Object.entries(score.components ?? {})
            .sort((a, b) => a[1].score - b[1].score)
            .map(([name, component]) => [
              name,
              String(Math.round(component.score)),
              signal(component.score),
            ]);
          core.summary.addHeading('Component scores', 3).addTable([
            [
              { data: 'Component', header: true },
              { data: 'Score', header: true },
              { data: 'Signal', header: true },
            ],
            ...componentRows,
          ]);
          await core.summary.write();

    - name: Post sticky comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.diff.outputs.diff-json != ''
      uses: actions/github-script@v9
      env:
        DIFF_JSON: ${{ steps.diff.outputs.diff-json }}
        SCORE_JSON: ${{ steps.score.outputs.score-json }}
        OMEN_VERSION: ${{ steps.install.outputs.version }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          function loadJson(input) {
            if (!input) throw new Error('Missing JSON input');
            try {
              return JSON.parse(input);
            } catch {
              try {
                return JSON.parse(fs.readFileSync(input, 'utf8'));
              } catch {
                throw new Error(`Failed to parse JSON input or read file: ${input.slice(0, 100)}`);
              }
            }
          }

          const diff = loadJson(process.env.DIFF_JSON);
          const score = loadJson(process.env.SCORE_JSON);
          const prNumber = context.payload.pull_request.number;

          const signal = (n) => (n >= 80 ? 'Good' : n >= 60 ? 'Watch' : 'Needs work');

          const factorsTable = Object.entries(diff.factors)
            .sort((a, b) => b[1] - a[1])
            .map(([key, value]) => `| ${key} | ${Math.round(Number(value) * 100)}% |`)
            .join('\n');

          const recommendations = (diff.recommendations ?? [])
            .map(r => `- ${r}`)
            .join('\n') || 'No specific recommendations.';

          const componentsTable = Object.entries(score.components)
            .sort((a, b) => a[1].score - b[1].score)
            .map(([key, comp]) => `| ${key} | ${Math.round(comp.score)} | ${signal(comp.score)} |`)
            .join('\n');

          const tipConfig = {
            complexity: {
              threshold: 80,
              label: 'Complexity',
              command: 'omen complexity --sort cyclomatic',
              advice: 'Focus on functions with cyclomatic complexity > 10. Extract helper functions, replace nested conditionals with early returns, and use polymorphism instead of switch statements.',
            },
            duplication: {
              threshold: 70,
              label: 'Duplication',
              command: 'omen clones',
              advice: 'Look for Type-1 (exact) and Type-2 (renamed) clones. Extract shared logic into reusable functions or modules. Prioritize clones in high-churn files.',
            },
            cohesion: {
              threshold: 80,
              label: 'Cohesion',
              command: 'omen cohesion --sort lcom',
              advice: 'Classes with high LCOM (Lack of Cohesion) are doing too many unrelated things. Split them into focused classes where methods share instance variables.',
            },
            tdg: {
              threshold: 75,
              label: 'TDG',
              command: 'omen tdg --sort score',
              advice: 'Files with low TDG scores have compounding debt across multiple dimensions. Focus on files graded D or F -- they accumulate complexity, duplication, and coupling simultaneously.',
            },
            satd: {
              threshold: 80,
              label: 'Known Debt (SATD)',
              command: 'omen satd --sort severity',
              advice: 'Resolve high-severity items first (FIXME, BUG, SECURITY). Low-severity TODOs can be batch-addressed. Remove stale debt items that are no longer relevant.',
            },
            coupling: {
              threshold: 70,
              label: 'Coupling',
              command: 'omen graph && omen smells',
              advice: 'Break cyclic dependencies by introducing interfaces or extracting shared types. Reduce fan-out from hub modules by splitting responsibilities.',
            },
            smells: {
              threshold: 80,
              label: 'Architectural Smells',
              command: 'omen smells',
              advice: 'Address critical smells first (cyclic dependencies, god components). Hub modules with high fan-out should be split. Unstable modules that many others depend on need stabilization.',
            },
          };

          const lowestComponents = Object.entries(score.components)
            .filter(([name, comp]) => tipConfig[name] && comp.score < tipConfig[name].threshold)
            .sort((a, b) => a[1].score - b[1].score)
            .slice(0, 3);
          const attention = lowestComponents
            .map(([name, comp]) => {
              const tip = tipConfig[name];
              return `- **${tip.label}** (${Math.round(comp.score)}/100) &mdash; ${tip.advice}\n  \`${tip.command}\``;
            })
            .join('\n');
          const attentionBlock = attention ||
            'All components are above their attention thresholds. No specific action needed.';

          const healthScore = Math.round(score.overall_score);
          const riskLevel = diff.level.toUpperCase();
          const riskPct = Math.round(diff.score * 100);
          const criticalIssues = score.summary.critical_issues;

          const body = `<!-- omen-analysis -->
          ## Omen Analysis

          | Health | PR risk |
          |--------|---------|
          | **${score.grade}** &middot; ${healthScore}/100 | **${riskLevel}** &middot; ${riskPct}% |

          **Changes:** ${diff.files_modified} files &middot; +${diff.lines_added}/-${diff.lines_deleted} &middot; ${diff.commits} commits${criticalIssues ? ` &middot; ${criticalIssues} critical issue${criticalIssues === 1 ? '' : 's'}` : ''}

          ### Needs attention

          ${attentionBlock}

          <details>
          <summary>Component scores</summary>

          | Component | Score | Signal |
          |-----------|-------|--------|
          ${componentsTable}

          </details>

          <details>
          <summary>PR risk factors</summary>

          | Factor | Contribution |
          |--------|--------------|
          ${factorsTable}

          </details>

          <details>
          <summary>Recommendations</summary>

          ${recommendations}

          </details>

          <details>
          <summary>Investigate locally</summary>

          \`\`\`bash
          omen score            # health score with component breakdown
          omen diff             # PR risk analysis
          omen hotspot          # high-churn + high-complexity files
          \`\`\`

          Run the analyzer named next to each component above to find the specific files, make targeted refactors, then re-run \`omen score\` to confirm the change.

          </details>

          ---

          Generated by omen v${process.env.OMEN_VERSION}`;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          const existing = comments.find(c => c.body?.includes('<!-- omen-analysis -->'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }

    - name: Manage risk label
      if: inputs.label == 'true' && github.event_name == 'pull_request' && steps.diff.outputs.risk-level != ''
      uses: actions/github-script@v9
      env:
        RISK_LEVEL: ${{ steps.diff.outputs.risk-level }}
        LABEL_TEMPLATE: ${{ inputs.label-template }}
        COLOR_LOW: ${{ inputs.label-color-low }}
        COLOR_MEDIUM: ${{ inputs.label-color-medium }}
        COLOR_HIGH: ${{ inputs.label-color-high }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const riskLevel = process.env.RISK_LEVEL;
          const template = process.env.LABEL_TEMPLATE;
          const prNumber = context.payload.pull_request.number;
          const currentLabel = template.replace('{{level}}', riskLevel);

          const colors = {
            low: process.env.COLOR_LOW,
            medium: process.env.COLOR_MEDIUM,
            high: process.env.COLOR_HIGH,
          };
          const color = colors[riskLevel];
          if (!color) {
            core.setFailed(`Unexpected risk level: '${riskLevel}'`);
            return;
          }

          // Get current labels on the PR
          const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          const currentLabelNames = new Set(currentLabels.map(l => l.name));

          // Remove stale risk labels that are actually on the PR
          for (const level of ['low', 'medium', 'high']) {
            const label = template.replace('{{level}}', level);
            if (label !== currentLabel && currentLabelNames.has(label)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label,
              });
            }
          }

          // Create or update label definition with correct color
          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: currentLabel,
              color,
            });
          } catch (e) {
            if (e.status === 422) {
              await github.rest.issues.updateLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: currentLabel,
                color,
              });
            } else {
              throw e;
            }
          }

          // Add label to PR
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            labels: [currentLabel],
          });

    - name: Check threshold
      if: inputs.check == 'true'
      uses: actions/github-script@v9
      env:
        RISK_LEVEL: ${{ steps.diff.outputs.risk-level }}
        THRESHOLD: ${{ inputs.check-threshold }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const levels = { low: 1, medium: 2, high: 3 };
          const riskLevel = process.env.RISK_LEVEL;
          const threshold = process.env.THRESHOLD;
          const limit = levels[threshold];

          if (!limit) {
            core.setFailed(`Invalid risk threshold '${threshold}' (expected low|medium|high)`);
            return;
          }
          if (!riskLevel) {
            core.warning('Risk threshold check skipped because diff analysis is only available for pull request events.');
            return;
          }

          const actual = levels[riskLevel];
          if (!actual) {
            core.setFailed(`Invalid risk level '${riskLevel}' (expected low|medium|high)`);
            return;
          }
          if (actual >= limit) {
            core.setFailed(`Risk level '${riskLevel}' meets or exceeds threshold '${threshold}'`);
          }
