name: Omen Analysis

on:
  pull_request:
    branches: [main]

permissions:
  # Minimum feature permissions: checkout and release lookup need contents: read;
  # sticky PR comments need pull-requests: write; risk labels need issues: write.
  # Job summaries and threshold checks need no additional repository permission.
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Omen analyzes itself with the omen of this pull request. A released
      # omen cannot read an omen.toml that uses keys of a newer version.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build omen
        run: cargo build --release --bin omen

      - name: Run Omen
        id: omen
        uses: ./
        with:
          binary: target/release/omen
          summary: 'true'
          comment: 'true'
          label: 'true'
