name: Omen Analysis

on:
  pull_request:
    branches: [main]

permissions:
  # Minimum feature permissions: checkout and release lookup need contents: read;
  # sticky PR comments need pull-requests: write; risk labels need issues: write.
  # Job summaries and threshold checks need no additional repository permission.
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Omen
        id: omen
        uses: panbanda/omen@omen-v4.26.1
        with:
          summary: 'true'
          comment: 'true'
          label: 'true'
