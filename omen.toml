# Omen Configuration (Rust CLI)
# Documentation: https://github.com/panbanda/omen

# Exclude patterns (glob)
exclude = [
    # Test and benchmark files
    "*_test.rs",
    "tests/**",
    "benches/**",

    # Build/output directories
    "target/**",
    ".git/**",
    ".omen/**",
    "dist/**",
    "build/**",
    "bin/**",

    # Lock files
    "Cargo.lock",

    # Documentation
    "**/README.md",
    "**/CHANGELOG.md",
]

[complexity]
cyclomatic_error = 20
cognitive_error = 30

[satd]
custom_markers = []

[churn]
since = "6m"
top = 20

[duplicates]
min_tokens = 50
min_similarity = 0.9

[hotspot]
top = 20

[score]
fail_under = 70.0

[feature_flags]
stale_days = 90
custom_providers = []
